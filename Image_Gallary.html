<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #222;
        }

        .filters {
            margin: 20px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.04);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: #000e;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 75vh;
            border-radius: 10px;
        }

        @media (max-width: 650px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>
    <p>Explore beautiful images!</p>

    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('city')">City</button>
    </div>

    <div class="gallery">

        <img class="nature"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
        alt="Beautiful nature" onclick="openImage(this)">

        <img class="city"
        src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600"
        alt="City view" onclick="openImage(this)">

        <img class="nature"
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
        alt="Mountain lake" onclick="openImage(this)">

        <img class="city"
        src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=600"
        alt="City buildings" onclick="openImage(this)">

        <img class="nature"
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
        alt="Forest" onclick="openImage(this)">

        <img class="city"
        src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600"
        alt="Architecture" onclick="openImage(this)">

    </div>

    <div class="lightbox" id="lightbox">
        <img id="largeImage" src="" alt="Selected image">

        <div>
            <button onclick="previousImage()">Previous</button>
            <button onclick="closeImage()">Close</button>
            <button onclick="nextImage()">Next</button>
        </div>
    </div>

    <script>
        const images = document.querySelectorAll(".gallery img");
        let currentIndex = 0;

        function filterImages(category) {
            images.forEach(function(image) {
                if (category === "all" ||
                    image.classList.contains(category)) {
                    image.style.display = "block";
                } else {
                    image.style.display = "none";
                }
            });
        }

        function openImage(image) {
            currentIndex = Array.from(images).indexOf(image);
            document.getElementById("largeImage").src = image.src;
            document.getElementById("lightbox").style.display = "flex";
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage();
        }

        function previousImage() {
            currentIndex =
                (currentIndex - 1 + images.length) % images.length;
            showImage();
        }

        function showImage() {
            document.getElementById("largeImage").src =
                images[currentIndex].src;
        }

        function closeImage() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
